name: prep_book

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@bca17593224500d894e3fc7df09937ec603e35cd # v1.21.0

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bca17593224500d894e3fc7df09937ec603e35cd # v1.21.0
    with:
      flutter_version: 3.47.x
      run_bloc_lint: true
      setup: |
        npm run test:api
        flutter build web --release --target lib/main_championship.dart --tree-shake-icons

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@bca17593224500d894e3fc7df09937ec603e35cd # v1.21.0
    with:
      includes: |
        **/*.md
      modified_files_only: false
      config: cspell.json
