name: prep_book
description: Offline-first production recipe scaling for small restaurant and bakery kitchens.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  decimal: ^3.2.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  meta: ^1.19.0
  pdf: ^3.13.0
  printing: ^5.15.0
  rational: ^2.2.3
  sqflite: ^2.4.3

dev_dependencies:
  analyzer: ^13.3.0
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.2+1
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/fonts/NotoSansKR.ttf
    - assets/fonts/OFL.txt
  generate: true
  uses-material-design: true

scripts: merry.yaml
