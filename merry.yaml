# Generated by `merry init`, then filled in for this project.
#
# Every `flutter run` and `flutter build` here carries an explicit `--flavor` and
# `--target`, because the project has no `lib/main.dart` — only the three flavor
# entrypoints. A bare `flutter run` fails before it reaches a build.

# --- Development workflow ---------------------------------------------------
dev:
  (default): $dev:development

  development:
    (description): Runs the development flavor with hot reload.
    (scripts): flutter run --flavor development --target lib/main_development.dart

  staging:
    (description): Runs the staging flavor on the attached device.
    (scripts): flutter run --flavor staging --target lib/main_staging.dart

  production:
    (description): Runs the production flavor on the attached device.
    (scripts): flutter run --flavor production --target lib/main_production.dart

# --- Quality gates ----------------------------------------------------------
analyze:
  (description): Static analysis with very_good_analysis (zero tolerance, matches CI).
  (scripts): flutter analyze

lint:
  (description): Bloc-specific lints, the check CI enables through run_bloc_lint.
  (scripts): dart run bloc_tools:bloc lint .

format:
  (default): $format:write

  write:
    (description): Applies automated fixes and formats the Dart sources.
    # `dart fix` takes exactly one path per invocation — a second one makes it
    # print its usage instead — so lib and test get a line each.
    (scripts):
      - dart fix --apply lib
      - dart fix --apply test
      - dart format lib test

  check:
    (description): Fails when sources are not formatted, without writing anything.
    (scripts): dart format --output=none --set-exit-if-changed lib test

pretest:
  (description): Clears the previous coverage report.
  (scripts): rm -rf coverage

test:
  (description): Runs the suite without coverage, for a fast local loop.
  (scripts): flutter test --concurrency=4 --test-randomize-ordering-seed=random

coverage:
  (aliases): cov
  # `very_good`, not `flutter test --coverage`: the reason this project needs the
  # optimization entrypoint to decide a line is genuinely uncovered is in CLAUDE.md.
  (description): Runs the suite with coverage the way CI decides it.
  (scripts): very_good test --coverage --test-randomize-ordering-seed random

postcoverage:
  (description): Generates an HTML coverage report from the coverage data.
  (scripts): genhtml coverage/lcov.info -o coverage/html --quiet

precheck:
  # Not a convenience. `very_good_analysis` carries `formatter: trailing_commas:
  # preserve`, and `dart format` only reaches that setting through the resolved
  # package. On an unresolved checkout the formatter falls back to its default
  # and reports eight test files as unformatted, which would stop the gate below
  # on its first step. CI never sees this because it resolves packages first.
  (description): Resolves packages, so the formatter can read the shared analysis options.
  (scripts): flutter pub get

check:
  (description): The full local gate before committing — format, analyze, bloc lint, test.
  (execution): once
  (scripts):
    - $format:check
    - $analyze
    - $lint
    - $test

# --- Code generation --------------------------------------------------------
l10n:
  (aliases): gen-l10n
  (description): Regenerates localizations from the ARB files (config in l10n.yaml).
  (scripts): flutter gen-l10n

# --- Maintenance ------------------------------------------------------------
reinstall:
  (description): Clears the build output and refetches dependencies.
  (scripts):
    - flutter clean
    - flutter pub get

hard:
  (description): Upgrades Flutter itself, then bumps every package to its latest major and tightens the constraints.
  (scripts):
    - flutter upgrade --force
    - flutter packages upgrade --major-versions --tighten

# --- Build artifacts --------------------------------------------------------
# No `(default)`: which artifact this project ships is a release decision, not
# something a script file gets to pick. macOS is a scaffold, not a target.
build:
  apk:
    (description): Builds the production release APK.
    (scripts): flutter build apk --release --flavor production --target lib/main_production.dart --tree-shake-icons

  aab:
    (description): Builds the production release Android App Bundle.
    (scripts): flutter build appbundle --release --flavor production --target lib/main_production.dart --tree-shake-icons

  ipa:
    (description): Builds the production release iOS archive and IPA.
    (scripts): flutter build ipa --release --flavor production --target lib/main_production.dart --tree-shake-icons
